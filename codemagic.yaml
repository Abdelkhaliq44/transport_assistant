workflows:
  ios-build-transport-assistant:
    name: iOS Build Workflow - Transport Assistant
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      # -------------------------------
      # تنظيف المشروع (مهم جدا)
      # -------------------------------
      - name: Clean project
        script: |
          echo "Cleaning project..."
          flutter clean

      # -------------------------------
      # تحميل dependencies
      # -------------------------------
      - name: Get Flutter dependencies
        script: |
          echo "Fetching dependencies..."
          flutter pub get

      # -------------------------------
      # إصلاح CocoaPods (حل Flutter.h)
      # -------------------------------
      - name: Fix iOS Pods
        script: |
          echo "Fixing Pods..."
          cd ios
          rm -rf Pods Podfile.lock
          pod deintegrate
          pod setup
          pod install --repo-update
          cd ..

      # -------------------------------
      # بناء IPA مباشرة (الطريقة الصحيحة)
      # -------------------------------
      - name: Build iOS IPA
        script: |
          echo "Building IPA..."
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
