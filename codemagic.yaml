workflows:
  ios-build-transport-assistant:
    name: iOS Build Workflow - Transport Assistant
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      # -------------------------------
      # تنظيف المشروع
      # -------------------------------
      - name: Clean project
        script: |
          echo "Cleaning project..."
          flutter clean

      # -------------------------------
      # تحميل dependencies
      # -------------------------------
      - name: Get Flutter dependencies
        script: |
          echo "Fetching dependencies..."
          flutter pub get

      # -------------------------------
      # إصلاح iOS Pods (Deep Clean)
      # -------------------------------
      - name: Fix iOS Pods (Deep Clean)
        script: |
          echo "Deep cleaning iOS..."
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf .symlinks
          rm -rf Flutter/Flutter.framework
          rm -rf Flutter/Flutter.podspec
          cd ..
          flutter pub get
          cd ios
          pod deintegrate
          pod setup
          pod install --repo-update
          cd ..

      # -------------------------------
      # بناء IPA (Flutter يقوم بالبناء)
      # -------------------------------
      - name: Build iOS IPA
        script: |
          echo "Building IPA..."
          flutter build ipa --release --no-codesign --verbose

      # -------------------------------
      # التأكد من وجود IPA ونقله إلى مجلد ثابت
      # -------------------------------
      - name: Prepare IPA artifact
        script: |
          mkdir -p build/ios/ipa
          IPA_PATH=$(find build/ios/ -name "*.ipa" | head -n 1)
          if [ -f "$IPA_PATH" ]; then
            echo "IPA found at $IPA_PATH, copying..."
            cp "$IPA_PATH" build/ios/ipa/security_check.ipa
          else
            echo "No IPA found!"
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
