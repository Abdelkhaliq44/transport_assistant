workflows:
  ios-build-transport-assistant:
    name: iOS Build Workflow - Transport Assistant
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      # -------------------------------
      # تنظيف المشروع
      # -------------------------------
      - name: Clean project
        script: |
          echo "Cleaning project..."
          flutter clean

      # -------------------------------
      # تحميل dependencies
      # -------------------------------
      - name: Get Flutter dependencies
        script: |
          echo "Fetching dependencies..."
          flutter pub get

      # -------------------------------
      # إصلاح iOS Pods (Deep Clean)
      # -------------------------------
      - name: Fix iOS Pods (Deep Clean)
        script: |
          echo "Deep cleaning iOS..."
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf .symlinks
          rm -rf Flutter/Flutter.framework
          rm -rf Flutter/Flutter.podspec
          cd ..
          flutter pub get
          cd ios
          pod deintegrate
          pod setup
          pod install --repo-update
          cd ..

      # -------------------------------
      # بناء الـ xcarchive (بدون توقيع)
      # -------------------------------
      - name: Build iOS Archive
        script: |
          echo "Building xcarchive..."
          flutter build ipa --release --no-codesign --verbose

      # -------------------------------
      # تشخيص - شوف إيش بُني فعلاً
      # -------------------------------
      - name: Debug build output
        script: |
          echo "=== محتوى مجلد build/ios ==="
          find build/ios/ -type f | sort

      # -------------------------------
      # تحويل xcarchive إلى IPA يدوياً
      # -------------------------------
      - name: Export IPA from archive
        script: |
          ARCHIVE=$(find build/ios/archive -name "*.xcarchive" | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "❌ ما لقينا xcarchive! محتوى المجلد:"
            find build/ios/ -type d | head -20
            exit 1
          fi

          echo "✅ وجدنا الأرشيف: $ARCHIVE"

          APP=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "❌ ما لقينا .app داخل الأرشيف!"
            exit 1
          fi

          echo "✅ وجدنا التطبيق: $APP"

          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/

          mkdir -p build/ios/ipa
          cd /tmp
          zip -r "$OLDPWD/build/ios/ipa/transport_assistant.ipa" Payload

          echo "✅ تم إنشاء IPA بنجاح!"

      # -------------------------------
      # التأكد من وجود IPA
      # -------------------------------
      - name: Verify IPA
        script: |
          IPA_PATH="build/ios/ipa/transport_assistant.ipa"
          if [ -f "$IPA_PATH" ]; then
            echo "✅ IPA موجود وجاهز: $IPA_PATH"
            ls -lh "$IPA_PATH"
          else
            echo "❌ IPA مش موجود!"
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
