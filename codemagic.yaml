workflows:
  ios-build-transport-assistant:
    name: iOS Build Workflow - Transport Assistant
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      # -------------------------------
      # تنظيف المشروع
      # -------------------------------
      - name: Clean project
        script: |
          echo "Cleaning project..."
          flutter clean

      # -------------------------------
      # تحميل dependencies
      # -------------------------------
      - name: Get Flutter dependencies
        script: |
          echo "Fetching dependencies..."
          flutter pub get

      # -------------------------------
      # إصلاح iOS Pods (حل المشكلة الحقيقي)
      # -------------------------------
      - name: Fix iOS Pods (Deep Clean)
        script: |
          echo "Deep cleaning iOS..."

          cd ios

          # حذف كل شيء متعلق بـ Pods و Flutter
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf .symlinks
          rm -rf Flutter/Flutter.framework
          rm -rf Flutter/Flutter.podspec

          # إعادة توليد ملفات Flutter iOS
          cd ..
          flutter pub get

          cd ios

          # إعادة ربط CocoaPods بشكل صحيح
          pod deintegrate
          pod setup
          pod install --repo-update

          cd ..

      # -------------------------------
      # بناء IPA (مع verbose للتشخيص)
      # -------------------------------
      - name: Build iOS IPA
        script: |
          echo "Building IPA..."
          flutter build ipa --release --no-codesign --verbose

    artifacts:
      - build/ios/ipa/*.ipa
