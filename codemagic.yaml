workflows:
  ios-build-transport-assistant:
    name: iOS Build Workflow - Transport Assistant
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      # -------------------------------
      # تثبيت dependencies
      # -------------------------------
      - name: Get Flutter dependencies
        script: |
          cd transport_assistant
          flutter packages pub get

      # -------------------------------
      # بناء التطبيق بدون توقيع
      # -------------------------------
      - name: Build iOS IPA
        script: |
          cd transport_assistant
          flutter build ios --release --no-codesign

      # -------------------------------
      # تجميع التطبيق في قالب IPA
      # -------------------------------
      - name: Package IPA
        script: |
          cd transport_assistant/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload
          zip -r ../ipa/transport_assistant.ipa Payload

    artifacts:
      - transport_assistant/build/ios/ipa/*.ipa
