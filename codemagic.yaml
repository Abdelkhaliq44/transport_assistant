workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS IPA
        script: |
          # بناء التطبيق بدون توقيع رقمي
          flutter build ios --release --no-codesign

          # تجميع التطبيق في قالب IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../ipa/transport_assistant.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
