workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          set -e
          echo "Fetching Flutter dependencies..."
          flutter pub get
          echo "Dependencies fetched successfully."

      - name: Install iOS dependencies with CocoaPods
        script: |
          set -e
          echo "Installing CocoaPods dependencies..."
          cd ios
          pod repo update
          pod install
          cd ..
          echo "CocoaPods dependencies installed."

      - name: Build iOS IPA
        script: |
          set -e
          echo "Starting iOS IPA build..."
          
          # بناء التطبيق وإنشاء IPA مباشرة بدون توقيع رقمي
          flutter build ipa --release --no-codesign --export-method ad-hoc
          
          echo "iOS IPA built successfully."

    artifacts:
      - build/ios/ipa/*.ipa
