workflows:
  ios-build-transport-assistant:
    name: iOS Build Workflow - Transport Assistant
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      # -------------------------------
      # تنظيف المشروع
      # -------------------------------
      - name: Clean project
        script: |
          echo "Cleaning project..."
          flutter clean

      # -------------------------------
      # تحميل dependencies
      # -------------------------------
      - name: Get Flutter dependencies
        script: |
          echo "Fetching dependencies..."
          flutter pub get

      # -------------------------------
      # إصلاح iOS Pods (Deep Clean)
      # -------------------------------
      - name: Fix iOS Pods (Deep Clean)
        script: |
          echo "Deep cleaning iOS..."
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf .symlinks
          rm -rf Flutter/Flutter.framework
          rm -rf Flutter/Flutter.podspec
          cd ..
          flutter pub get
          cd ios
          pod deintegrate
          pod setup
          pod install --repo-update
          cd ..

      # -------------------------------
      # بناء IPA مباشرة في مجلد ثابت
      # -------------------------------
      - name: Build iOS IPA
        script: |
          echo "Building IPA..."
          flutter build ipa --release --no-codesign --export-path build/ios/ipa --verbose

    artifacts:
      - build/ios/ipa/*.ipa
